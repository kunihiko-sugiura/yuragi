<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ゆらぎ</title>
<style>
  :root {
    --paper: #efede7;
    --ink: #5c6466;
    --ink-faint: #7d8482;
    --circle-saturation: 16%;
    --circle-lightness: 52%;
    --circle-alpha: 0.42;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141718;
      --ink: #a9b0b0;
      --ink-faint: #737b7c;
      --circle-saturation: 18%;
      --circle-lightness: 70%;
      --circle-alpha: 0.3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(28px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 0 16px;
  }
  button {
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.32em;
    color: var(--ink-faint);
    background: none;
    border: 0;
    border-bottom: 1px solid transparent;
    padding: 12px 4px 8px 8px;
    min-width: 44px;
    min-height: 44px;
    cursor: pointer;
    transition: color 0.8s ease, border-color 0.8s ease;
  }
  button:hover { color: var(--ink); }
  button:focus-visible { outline: 1px solid var(--ink-faint); outline-offset: 4px; }
  #toggle { color: var(--ink); min-width: 72px; }
  button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink-faint); }
  .rule { width: 1px; height: 14px; background: var(--ink-faint); opacity: 0.5; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body data-state="idle">
<canvas id="field" aria-hidden="true"></canvas>
<nav aria-label="再生操作">
  <button id="toggle" type="button">再生</button>
  <span class="rule" aria-hidden="true"></span>
  <button id="timbre-piano" type="button" data-timbre="piano" aria-pressed="true" aria-label="音源A ピアノ的">A</button>
  <button id="timbre-pad" type="button" data-timbre="pad" aria-pressed="false" aria-label="音源B パッド的">B</button>
</nav>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
