<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ゆらぎ</title>
<style>
  :root {
    --paper: #efede7;
    --ink: #5c6466;
    --ink-faint: #7d8482;
    --circle-saturation: 30%;
    --circle-lightness: 58%;
    --circle-alpha: 0.8;
    --reveal: 1.2s;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141718;
      --ink: #a9b0b0;
      --ink-faint: #737b7c;
      --circle-saturation: 42%;
      --circle-lightness: 80%;
      --circle-alpha: 0.8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    overflow: hidden;
  }
  /* 音が始まる前は画面全体が開始の入口。 */
  body:not(.started) { cursor: pointer; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(28px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 0 16px;
    transition: opacity var(--reveal) ease;
  }
  body:not(.started) nav { opacity: 0; visibility: hidden; }
  button {
    color: var(--ink);
    background: none;
    border: 0;
    padding: 10px 6px;
    min-width: 44px;
    min-height: 44px;
    cursor: pointer;
    opacity: 0.38;
    transition: opacity 0.8s ease;
  }
  button:hover { opacity: 0.7; }
  button:focus-visible { outline: 1px solid var(--ink-faint); outline-offset: 4px; }
  button[aria-pressed="true"] { opacity: 1; }
  #timbre { opacity: 0.7; }
  #timbre:hover { opacity: 1; }
  #timbre svg[hidden] { display: none; }
  svg { display: block; width: 32px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: reduce) {
    :root { --reveal: 0.3s; }
    button { transition: none; }
  }
</style>
</head>
