<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ゆらぎ</title>
<style>
  :root {
    --paper: #efede7;
    --ink: #5c6466;
    --ink-faint: #7d8482;
    --circle-saturation: 16%;
    --circle-lightness: 52%;
    --circle-alpha: 0.42;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141718;
      --ink: #a9b0b0;
      --ink-faint: #737b7c;
      --circle-saturation: 18%;
      --circle-lightness: 70%;
      --circle-alpha: 0.3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(28px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 0 16px;
  }
  button {
    color: var(--ink);
    background: none;
    border: 0;
    padding: 10px 6px;
    min-width: 44px;
    min-height: 44px;
    cursor: pointer;
    opacity: 0.38;
    transition: opacity 0.8s ease;
  }
  button:hover { opacity: 0.7; }
  button:focus-visible { outline: 1px solid var(--ink-faint); outline-offset: 4px; }
  button[aria-pressed="true"] { opacity: 1; }
  svg { display: block; width: 32px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<nav aria-label="音色">
  <button id="timbre-piano" type="button" data-timbre="piano" aria-pressed="true" aria-label="ピアノ的な音色">
    <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2.0 12.0L2.5 7.9L3.0 5.3L3.5 4.5L4.0 5.6L4.5 8.2L5.0 11.3L5.5 14.3L6.0 16.3L6.5 17.1L7.0 16.6L7.5 15.1L8.0 13.0L8.5 10.9L9.0 9.3L9.5 8.5L10.0 8.7L10.5 9.6L11.0 11.0L11.5 12.5L12.0 13.7L12.5 14.3L13.0 14.4L13.5 13.8L14.0 12.9L14.5 11.9L15.0 11.0L15.5 10.5L16.0 10.4L16.5 10.6L17.0 11.2L17.5 11.9L18.0 12.6L18.5 13.0L19.0 13.1L19.5 13.0L20.0 12.6L20.5 12.2L21.0 11.7L21.5 11.4L22.0 11.2L22.5 11.3L23.0 11.5L23.5 11.8L24.0 12.1L24.5 12.4L25.0 12.5L25.5 12.5L26.0 12.4L26.5 12.2L27.0 12.0L27.5 11.8L28.0 11.7L28.5 11.6L29.0 11.7L29.5 11.8L30.0 12.0"/></svg>
  </button>
  <button id="timbre-pad" type="button" data-timbre="pad" aria-pressed="false" aria-label="パッド的な音色">
    <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2.0 12.0L2.5 11.9L3.0 11.7L3.5 11.2L4.0 10.7L4.5 10.2L5.0 9.7L5.5 9.2L6.0 9.0L6.5 8.9L7.0 9.0L7.5 9.4L8.0 10.1L8.5 10.9L9.0 12.0L9.5 13.2L10.0 14.4L10.5 15.7L11.0 16.8L11.5 17.7L12.0 18.3L12.5 18.7L13.0 18.6L13.5 18.2L14.0 17.5L14.5 16.4L15.0 15.1L15.5 13.6L16.0 12.0L16.5 10.4L17.0 8.9L17.5 7.6L18.0 6.5L18.5 5.8L19.0 5.4L19.5 5.3L20.0 5.7L20.5 6.3L21.0 7.2L21.5 8.3L22.0 9.6L22.5 10.8L23.0 12.0L23.5 13.1L24.0 13.9L24.5 14.6L25.0 15.0L25.5 15.1L26.0 15.0L26.5 14.8L27.0 14.3L27.5 13.8L28.0 13.3L28.5 12.8L29.0 12.3L29.5 12.1L30.0 12.0"/></svg>
  </button>
</nav>
<script src="engine.js"></script>
<script>
(() => {
  'use strict';
  const { CONFIG, createEngine, loudnessAt } = Yuragi;
  const FADE_IN = 0.5;

  const canvas = document.getElementById('field');
  const pen = canvas.getContext('2d');
  const timbreButtons = [...document.querySelectorAll('[data-timbre]')];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const params = new URLSearchParams(location.search);
  const tuning = params.get('tuning');
  // 改訂前のピアノと聴き比べるための入口。?a=soft でピアノ側が旧音色になる。
  const pianoTimbre = params.get('a') === 'soft' ? 'pianoSoft' : 'piano';
  document.getElementById('timbre-piano').dataset.timbre = pianoTimbre;

  const context = new AudioContext({ latencyHint: 'playback' });
  const engine = createEngine(context, { timbre: pianoTimbre, tuning });
  const analyser = context.createAnalyser();
  const player = { events: [], played: 0 };

  function schedule() {
    const created = engine.scheduleUntil(context.currentTime + CONFIG.scheduler.lookahead);
    player.played += created.length;
    player.events.push(...created);
  }

  engine.master.connect(analyser);
  engine.master.gain.value = 0;
  engine.master.gain.setTargetAtTime(1, context.currentTime, FADE_IN);
  engine.start(context.currentTime + CONFIG.scheduler.lead);
  schedule();
  setInterval(schedule, CONFIG.scheduler.tick * 1000);

  // ブラウザは操作なしの発音を止める。止められた場合は最初の操作で鳴り始める。
  function wake() {
    if (context.state !== 'running') context.resume();
  }
  for (const type of ['pointerdown', 'pointerup', 'keydown']) addEventListener(type, wake);

  for (const button of timbreButtons) {
    button.addEventListener('click', () => {
      engine.timbre = button.dataset.timbre;
      for (const other of timbreButtons) other.setAttribute('aria-pressed', String(other === button));
    });
  }

  function resize() {
    const ratio = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * ratio);
    canvas.height = Math.round(innerHeight * ratio);
    pen.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  function draw() {
    pen.clearRect(0, 0, innerWidth, innerHeight);

    const style = getComputedStyle(document.documentElement);
    const saturation = style.getPropertyValue('--circle-saturation');
    const lightness = style.getPropertyValue('--circle-lightness');
    const strength = Number(style.getPropertyValue('--circle-alpha'));
    const now = context.currentTime - (context.outputLatency || 0);
    const unit = Math.min(innerWidth, innerHeight) * 0.17;
    const audible = engine.master.gain.value;

    player.events = player.events.filter((ev) => ev.time + ev.dur > now);
    for (const ev of player.events) {
      const age = now - ev.time;
      if (age < 0) continue;
      const voice = CONFIG.voices[ev.voice];
      const timbre = CONFIG.timbres[ev.timbre];
      const alpha = Math.cbrt(loudnessAt(timbre, age, ev.dur)) * strength * audible;
      if (alpha < 0.003) continue;
      const growth = reducedMotion.matches ? 1 : 0.75 + 0.45 * Math.sqrt(age / ev.dur);
      const radius = unit * voice.size * timbre.visualScale * growth;
      const x = voice.x * innerWidth;
      const y = voice.y * innerHeight;
      const hue = 168 + ev.voice * 11;
      const wash = pen.createRadialGradient(x, y, 0, x, y, radius);
      wash.addColorStop(0, `hsl(${hue} ${saturation} ${lightness} / ${alpha})`);
      wash.addColorStop(0.45, `hsl(${hue} ${saturation} ${lightness} / ${alpha * 0.55})`);
      wash.addColorStop(1, `hsl(${hue} ${saturation} ${lightness} / 0)`);
      pen.fillStyle = wash;
      pen.beginPath();
      pen.arc(x, y, radius, 0, Math.PI * 2);
      pen.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  window.__yuragi = {
    context,
    get events() { return player.events; },
    get played() { return player.played; },
    level() {
      const data = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(data);
      return Math.max(...data.map(Math.abs));
    },
  };
})();
</script>
</body>
</html>
